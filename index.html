<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/Portfolio/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Space+Grotesk:wght@300..700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Space+Grotesk:wght@300..700&display=swap" />
    <script>
      (function () {
        try {
          const saved = localStorage.getItem('theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          const useDark = saved ? saved === 'dark' : prefersDark;
          document.documentElement.classList.toggle('dark', useDark);
        } catch (_) {}
      })();
    </script>
    <style>
      html, body, #root {
        min-height: 100%;
      }

      body {
        margin: 0;
        background: #f8fbff;
      }

      html.dark body {
        background: #020617;
      }

      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background:
          radial-gradient(120% 90% at 50% 40%, rgba(96, 165, 250, 0.20), transparent 62%),
          #f8fbff;
        transition: opacity 220ms ease;
      }

      html.dark #boot-splash {
        background:
          radial-gradient(120% 90% at 50% 40%, rgba(34, 211, 238, 0.15), transparent 62%),
          #020617;
      }

      #boot-splash.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .boot-mark {
        width: 44px;
        height: 44px;
        border-radius: 9999px;
        border: 2px solid rgba(59, 130, 246, 0.25);
        border-top-color: rgba(59, 130, 246, 0.95);
        animation: boot-spin 0.9s linear infinite;
      }

      html.dark .boot-mark {
        border-color: rgba(34, 211, 238, 0.25);
        border-top-color: rgba(34, 211, 238, 0.95);
      }

      @keyframes boot-spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <title>tmp-vite-app</title>
    <script type="module" crossorigin src="/Portfolio/assets/index-DofKlDnu.js"></script>
    <link rel="modulepreload" crossorigin href="/Portfolio/assets/react-Ca03aNmg.js">
    <link rel="stylesheet" crossorigin href="/Portfolio/assets/index-CG_MNWWn.css">
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
      <div class="boot-mark"></div>
    </div>
    <div id="root"></div>
  </body>
</html>
